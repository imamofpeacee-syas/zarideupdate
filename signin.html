<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Zaride</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signin-style.css" />
</head>
<body class="signin-body">

  <!-- Main Sign In Container Card -->
  <div class="auth-card">
    
    <!-- Top Back to Home Button -->
    <a href="index.html" class="back-home-btn" title="Back to Home">&larr; Home</a>

    <!-- Header Section -->
    <div class="auth-header">
      <div class="brand-badge">
        <svg class="brand-icon" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M 80,100 C 80,60 110,40 160,40 L 400,40 C 440,40 460,60 460,90 C 460,110 440,135 410,165 L 200,370 L 380,370 C 420,370 450,400 450,440 C 450,470 420,480 370,480 L 130,480 C 80,480 50,450 50,400 C 50,370 70,335 110,290 L 310,100 L 160,100 C 110,100 80,80 80,100 Z" fill="#008751"/>
          <path d="M 235,150 C 185,150 145,190 145,240 C 145,305 235,370 235,370 C 235,370 325,305 325,240 C 325,190 285,150 235,150 Z" fill="#FFC107"/>
          <circle cx="235" cy="235" r="32" fill="#003d25"/>
        </svg>
      </div>
      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Sign in to continue your ride with Zaride</p>
    </div>

    <!-- Role Switcher Tabs (Passenger vs Driver) -->
    <div class="role-tabs">
      <button class="tab-btn active" id="passengerTab" data-role="passenger">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        Passenger
      </button>
      <button class="tab-btn" id="driverTab" data-role="driver">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-3h14v3z"/><circle cx="7.5" cy="15.5" r="1.5"/><circle cx="16.5" cy="15.5" r="1.5"/></svg>
        Driver
      </button>
    </div>

    <!-- Sign In Form -->
    <form id="signinForm" class="auth-form" onsubmit="return false;">
      
      <!-- Input Mode Toggle (Phone / Email) -->
      <div class="input-toggle-row">
        <label>Sign in with:</label>
        <div class="toggle-links">
          <button type="button" class="link-toggle active" id="usePhoneBtn">Phone Number</button>
          <span>|</span>
          <button type="button" class="link-toggle" id="useEmailBtn">Email Address</button>
        </div>
      </div>

      <!-- Phone Input Field -->
      <div class="form-group" id="phoneGroup">
        <label for="phoneNumber">Phone Number</label>
        <div class="phone-input-wrap">
          <span class="country-prefix">🇳🇬 +234</span>
          <input type="tel" id="phoneNumber" placeholder="801 234 5678" required />
        </div>
      </div>

      <!-- Email Input Field (Hidden by default) -->
      <div class="form-group hidden" id="emailGroup">
        <label for="emailAddress">Email Address</label>
        <div class="input-icon-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <input type="email" id="emailAddress" placeholder="name@example.com" />
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <div class="label-row">
          <label for="password">Password</label>
          <a href="#forgot" class="forgot-link">Forgot Password?</a>
        </div>
        <div class="input-icon-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" placeholder="Enter your password" required />
          <button type="button" class="toggle-password" id="togglePasswordBtn">Show</button>
        </div>
      </div>

      <!-- Remember Me Checkbox -->
      <div class="form-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" checked />
          <span>Keep me logged in</span>
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-submit" id="submitBtn">
        Sign In as Passenger
      </button>

      <!-- Divider -->
      <div class="divider">
        <span>or sign in with</span>
      </div>

      <!-- Social Logins -->
      <div class="social-login-grid">
        <button type="button" class="btn-social">
          <svg viewBox="0 0 24 24" class="social-icon"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.2 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12.5s.7 2.8 1.9 5.2l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.2-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/></svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <svg viewBox="0 0 24 24" class="social-icon" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.32c.62-.76 1.05-1.82.93-2.88-.91.04-2.03.61-2.68 1.37-.58.67-1.09 1.76-.95 2.8.1.01 2.08-.53 2.7-1.29z"/></svg>
          Apple
        </button>
      </div>

    </form>

    <!-- Footer Redirect Link -->
    <div class="auth-footer">
      Don't have an account yet? <a href="join.html">Create One</a>
    </div>

  </div>

  <script src="signin-script.js"></script>

  
</body>
</html>
